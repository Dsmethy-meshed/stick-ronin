<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17151b">
<title>Editor de animaciones</title>
<style>
/* VOICE: herramienta de taller, precisa y tranquila. IDEA: mesa de animador con papel cebolla y regla de tiempos.
   PICTURE: el stickman 3D editable ocupa la mitad superior. COLOUR: grafito, papel hueso, rojo bufanda como acento.
   TYPE: system-ui, 4 tamaños. LAYOUT: vista arriba, regla de tiempo, transporte, pestañas y panel abajo. */
:root{color-scheme:dark;--bg:#17151b;--panel:#211e26;--line:#3a3540;--ink:#ece6dd;--dim:#a49b92;--acc:#d1242c;--acc2:#f0c35a;--blue:#6fb6ff}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;height:100dvh;overflow:hidden}
header{display:flex;gap:6px;align-items:center;padding:8px;background:var(--panel);border-bottom:1px solid var(--line)}
header select{flex:1}
#bPlayGame{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;text-decoration:none;white-space:nowrap}
button,select,input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:#2c2832;border:1px solid var(--line);border-radius:10px}
button{min-height:44px;padding:0 12px;font-weight:650;white-space:nowrap}
button:active{background:#3a3540}
button.acc{background:var(--acc);border-color:var(--acc);color:#fff}
button.on{background:#3d2a2e;border-color:var(--acc);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
select{min-height:44px;padding:0 10px;font-size:16px}
input[type=text],input[type=number]{min-height:44px;padding:0 10px;font-size:16px;width:100%}
textarea{width:100%;min-height:96px;padding:8px;font:13px/1.4 ui-monospace,monospace;resize:vertical}
#view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bPlayGame{display:inline-flex;align-items:center;justify-content:center}
#sbBar.on{display:flex}
#sbBar>*{flex:0 0 auto}
#view.sb #selLabel{display:none}
#sbBar button,#sbBar select{min-height:36px;font-size:13px;padding:0 10px}
#sbBar .chip{background:#3d2a2e;border-color:var(--acc);color:#fff}
#sbBar .chip.cur{box-shadow:0 0 0 2px var(--acc2)}
#sbBar .lab{font-size:12px;color:var(--dim)}
#tl{height:70px;background:#1c1a21;border-top:1px solid var(--line);touch-action:none;position:relative}
#tl canvas{width:100%;height:100%;display:block}
#transport{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--panel)}
#tTime{font-variant-numeric:tabular-nums;min-width:4.6em;text-align:center;color:var(--dim);font-size:13px;white-space:nowrap}
#transport .grow{flex:1}
nav{display:flex;background:var(--panel);border-top:1px solid var(--line)}
nav button{flex:1;border:0;border-radius:0;background:transparent;color:var(--dim)}
nav button.on{color:#fff;box-shadow:inset 0 -3px 0 var(--acc);background:transparent}
#panel input[type=color]{width:56px;height:40px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#2c2832}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.row>label{flex:0 0 7.5em;color:var(--dim);font-size:13px}
.row input[type=range]{flex:1;min-width:120px;accent-color:var(--acc);height:32px}
.val{min-width:3.6em;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.card{border:1px solid var(--line);border-radius:12px;padding:6px 10px;margin:10px 0;background:#26222b}
.card h3{margin:4px 0;font-size:15px}
.hint{color:var(--dim);font-size:13px;margin:6px 0}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
/* ---- distribución (28 nov 2026), inspirada en Cascadeur (barra de herramientas fija + línea de tiempo con sus herramientas)
   y en Procreate Dreams / Stick Nodes (línea de tiempo táctil siempre a mano, iconos en vez de menús): sin menús desplegables ---- */
#app{display:flex;flex-direction:column}
#lib{flex:0 0 auto;display:flex;flex-direction:column;align-items:stretch;gap:0;background:var(--panel);border-bottom:1px solid var(--line);padding:4px 0}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px 6px}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;min-height:38px;padding:0 12px;border-radius:19px;font-size:14px;background:#2c2832}
.strip button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#aStrip button.on{background:#3d2a2e;border-color:var(--acc)}
.strip .live{color:var(--acc2)}
#view{position:relative;flex:1 1 auto;min-height:180px;overflow:hidden;touch-action:none}
.rail{position:absolute;top:6px;bottom:6px;z-index:5;display:flex;flex-direction:column;gap:4px;overflow-y:auto;scrollbar-width:none;width:54px}
.rail::-webkit-scrollbar{display:none}
#railL{left:6px}#railR{right:6px;top:96px}
.rail button,.rail a{flex:0 0 auto;min-height:46px;width:54px;padding:2px 0;border-radius:12px;border:1px solid #4a434f;background:rgba(36,33,42,.9);color:#fff;font:700 17px/1.1 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none}
.rail small{font:600 9px/1.1 system-ui,sans-serif;color:var(--dim);margin-top:2px;white-space:nowrap}
.rail .on small,.rail .rot small{color:#fff}
.rail button.on{background:#3d2a2e;border-color:var(--acc)}
.rail #bGzMode.rot{background:var(--acc);border-color:var(--acc)}
.rail #bPlayGame{background:var(--acc);border-color:var(--acc)}
#viewBar{display:contents}
#view #axg{position:absolute;inset:auto;right:6px;top:6px;width:84px;height:84px;z-index:4;touch-action:none}
#selLabel{position:absolute;left:66px;right:96px;top:6px;font-size:12px;color:var(--dim);pointer-events:none;background:rgba(23,21,27,.7);padding:4px 8px;border-radius:8px}
#sbBar{position:absolute;left:66px;right:66px;bottom:8px;z-index:4;display:none;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;align-items:center;background:rgba(23,21,27,.82);border:1px solid var(--line);border-radius:12px;padding:6px}
#actBadge{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;font-size:13px;font-weight:700;color:#fff;background:var(--acc);padding:4px 8px;border-radius:8px;display:none}
#dock{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line)}
#transport button{min-width:44px;padding:0 10px}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:48px;font-size:13px}
nav button b{font-size:18px;line-height:1}
#panel{max-height:32vh;overflow:auto;padding:8px 12px 16px;background:var(--panel)}
#dock.fold #panel{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips button{min-height:38px;padding:0 10px;font-size:13px;border-radius:19px}
.chips button.on{background:#3d2a2e;border-color:var(--acc);color:#fff}
.lbl{font-size:12px;color:var(--dim);margin:8px 0 2px}
@media (min-width:900px){#panel{max-height:38vh}}
/* móvil en horizontal: la vista ocupa toda la izquierda; biblioteca, tiempo y panel en una columna a la derecha */
@media (orientation:landscape) and (max-height:620px){#app{display:grid;grid-template-columns:1fr minmax(300px,42%);grid-template-rows:auto 1fr}#view{grid-column:1;grid-row:1/3;min-height:0}#lib{grid-column:2;grid-row:1}#dock{grid-column:2;grid-row:2;overflow:auto;min-height:0;border-left:1px solid var(--line)}#panel{max-height:none}}
</style>
</head>
<body>
<div id="app">
 <header id="lib">
  <div class="strip" id="wStrip" aria-label="Arma"></div>
  <div class="strip" id="aStrip" aria-label="Animación"></div>
 </header>
 <div id="view">
  <canvas id="cv3"></canvas>
  <canvas id="axg" aria-label="Ejes: toca uno para mirar desde ahí"></canvas>
  <div class="rail" id="railL" aria-label="Herramientas">
   <button id="bGzMode" type="button" title="Mover o rotar los puntos">✥<small>Mover</small></button>
   <button id="bChain" title="Mover en cadena: al mover la cadera, el cuerpo la sigue">⛓<small>Cadena</small></button>
   <button id="bPoles" title="Codos y rodillas: hacia dónde se doblan">◐<small>Codos</small></button>
   <button id="bGizmo" title="Flechas y anillos para mover y rotar">✛<small>Gizmo</small></button>
   <button id="bOnion" title="Fantasmas: clave anterior y siguiente">👻<small>Fantasma</small></button>
   <button id="bPath" title="Recorrido del arma">〰<small>Recorrido</small></button>
   <button id="bMix" title="Probar en movimiento (mezclado con correr)">🏃<small>Correr</small></button>
   <button id="bZm" title="Ver el modelo del zombi">🧟<small>Zombi</small></button>
   <button id="bZp" title="Ver el modelo del protagonista">🥷<small>Prota</small></button>
  </div>
  <div class="rail" id="railR" aria-label="Vista">
   <div id="viewBar"><button data-v="front" title="Vista de frente">F<small>Frente</small></button><button data-v="side" title="Vista de lado">L<small>Lado</small></button><button data-v="top" title="Vista desde arriba">A<small>Arriba</small></button><button data-v="free" title="Vista libre">3D<small>Libre</small></button></div>
   <button id="bCenter" title="Centrar la vista en el personaje">⊙<small>Centrar</small></button>
   <button id="bPan" title="Un dedo mueve la vista en vez de girarla">✋<small>Paneo</small></button>
   <button id="bUndo" title="Deshacer">↶<small>Deshacer</small></button>
   <button id="bRedo" title="Rehacer">↷<small>Rehacer</small></button>
   <button id="bFull" title="Pantalla completa">⛶<small>Pantalla</small></button>
   <a id="bPlayGame" href="index.html" title="Probar en el juego">🎮<small>Jugar</small></a>
  </div>
  <div id="selLabel">Toca un punto rojo para editar</div>
  <div id="sbBar" aria-label="Prueba en movimiento"></div>
  <div id="actBadge">GOLPE ACTIVO</div>
 </div>
 <div id="dock">
  <div id="tl"><canvas id="tlc"></canvas></div>
  <div id="transport">
   <button id="bPrevK" aria-label="Clave anterior">⏮</button>
   <button id="bPlay" class="acc" aria-label="Reproducir">▶</button>
   <button id="bNextK" aria-label="Clave siguiente">⏭</button>
   <span id="tTime">0.00 s</span>
   <span class="grow"></span>
   <button id="bAddK" title="Añadir clave aquí">◆＋</button>
   <button id="bDelK" title="Borrar la clave">◆✕</button>
  </div>
  <nav><button data-tab="pose" class="on"><b>🦴</b>Pose</button><button data-tab="col"><b>⚔</b>Golpes</button><button data-tab="fx"><b>✨</b>Efectos</button><button data-tab="anim"><b>🎬</b>Animación</button></nav>
  <section id="panel"></section>
 </div>
</div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="models/inkstyle.js?v=20261128f"></script>
<script src="models/zmodel.js?v=20261128f"></script>
<script>
{
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,D2R=Math.PI/180;
const lerp3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)],add3=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],mul3=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const nrm3=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,1600)}

/* ============ DATOS (mismo sistema de articulaciones que el juego) ============ */
const JN=['head','neck','pel','hL','hR','fL','fR'],JX=['chest','eL','eR','kL','kR'];
const sub3=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
function extDefaults(p){return{chest:lerp3(p.neck,p.pel,.42),eL:add3(lerp3(p.neck,p.hL,.5),[-.22,-.09,-.19]),eR:add3(lerp3(p.neck,p.hR,.5),[.22,-.09,-.19]),kL:add3(lerp3(p.pel,p.fL,.5),[0,0,.35]),kR:add3(lerp3(p.pel,p.fR,.5),[0,0,.35])}}
const JLABEL={head:'Cabeza',neck:'Cuello',pel:'Pelvis',hL:'Mano izquierda',hR:'Mano derecha',fL:'Pie izquierdo',fR:'Pie derecho',blade:'Arma (dirección)',root:'Raíz (posición del cuerpo)',chest:'Pecho (curva del torso)',eL:'Codo izquierdo (hacia dónde apunta)',eR:'Codo derecho (hacia dónde apunta)',kL:'Rodilla izquierda (hacia dónde apunta)',kR:'Rodilla derecha (hacia dónde apunta)'};
const EASES={lin:['Lineal',t=>t],in:['Acelera',t=>t*t*t],out:['Frena',t=>1-Math.pow(1-t,3)],inout:['Suave',t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2],out4:['Golpe seco',t=>1-Math.pow(1-t,4)],step:['Mantener',t=>t<1?0:1]};
const SLOTS={none:'Ninguno',idle:'Reposo',run:'Correr',k1:'Katana · combo 1',k2:'Katana · combo 2',k3:'Katana · combo 3 (giratorio)',ka:'Katana · desenvaine cargado',m1:'Maza · golpe rápido 1',m2:'Maza · golpe rápido 2',mc:'Maza · golpe cargado'};
const LAYER_DEF={arms:1,head:.8,chest:.7,pel:.35,legs:.1,in:.08,out:.18,move:.5};const layerOf=a=>({...LAYER_DEF,...(a.layer||{})});
const PIVOT=[.06,1.3,.12];
function dirAt(a,tilt){const ar=a*D2R,t=tilt*D2R,sa=Math.sin(ar);return[sa*Math.sin(t),sa*Math.cos(t),Math.cos(ar)]}
const IDLE={head:[0,1.6,.06],neck:[0,1.45,.04],pel:[0,.9,0],hL:[-.1,1.03,.28],hR:[.15,1,.26],fL:[-.16,0,.16],fR:[.16,0,-.12]};
const IDLE_BLADE=nrm3([.12,-.38,.92]);
function key(t,p,blade,o={}){return{t,ease:o.ease||'inout',p:clone(p),blade:blade.slice(),root:o.root||[0,0,0],ry:o.ry||0}}
function atkPose(dir,cr,maza,spin){
 const p=clone(IDLE);p.hR=add3(PIVOT,mul3(dir,.4));p.hL=add3(PIVOT,mul3(dir,.3));
 p.neck[0]+=dir[0]*.12;p.head[0]+=dir[0]*.16;p.neck[2]+=dir[2]*.12;p.head[2]+=dir[2]*.16;
 if(dir[1]>.3&&dir[2]<0){p.neck[2]-=.08;p.head[2]-=.1}
 const c=cr*(maza?.24:.14)*(spin?1.4:1);for(const j of['pel','neck','head'])p[j][1]-=c;p.pel[1]+=0;
 if(spin){p.fL=[-.28,0,.2];p.fR=[.28,0,-.2]}else{p.fL=[-.2,0,.4];p.fR=[.21,0,-.32];p.pel[2]+=cr*.1}
 return p;
}
function mkAttack(name,d,weapon){
 const maza=weapon==='maza',pull=d.a0+(d.a0-d.a1)*(maza?.1:.06),over=d.a1+(d.a1-d.a0)*.05;
 const T1=d.wind,T2=T1+d.strike,T3=T2+d.hold,T4=T3+d.rec,lz=(d.lunge||0)*.25;
 const k=[key(0,IDLE,IDLE_BLADE,{ease:'inout'}),
  key(T1,atkPose(dirAt(pull,d.tilt),.3,maza),dirAt(pull,d.tilt),{ease:'out4'}),
  key(T2,atkPose(dirAt(over,d.tilt),1,maza),dirAt(over,d.tilt),{ease:'out',root:[0,0,lz]}),
  key(T3,atkPose(dirAt(d.a1,d.tilt),1,maza),dirAt(d.a1,d.tilt),{ease:'inout',root:[0,0,lz]}),
  key(T4,IDLE,IDLE_BLADE,{ease:'inout',root:[0,0,lz]})];
 return{name,dur:+T4.toFixed(2),loop:false,weapon,keys:k,hurt:{r:.3,h:1.8},hits:[{s:+T1.toFixed(3),e:+T2.toFixed(3),shape:'blade',joint:'hR',r:maza?.2:.12,reach:d.reach,dmg:maza?30:20}],
  fx:[{t:+T1.toFixed(3),type:'sound',snd:maza?'whoosh':'swish'},{t:+T1.toFixed(3),type:'trail',dur:+(d.strike+.05).toFixed(3)},...(d.slam?[{t:+T2.toFixed(3),type:'slam',amt:.7}]:[])]};
}
function mkSpin(){
 const d={wind:.2,strike:.28,hold:.1,rec:.38,tilt:86,a0:140,a1:60,reach:1.9},T1=d.wind,T2=T1+d.strike,T3=T2+d.hold,T4=T3+d.rec;
 const a=dirAt(d.a0,d.tilt),b=dirAt(d.a1,d.tilt);
 return{name:'Katana · tajo giratorio',dur:+T4.toFixed(2),loop:false,weapon:'katana',hurt:{r:.3,h:1.8},
  keys:[key(0,IDLE,IDLE_BLADE),key(T1,atkPose(a,.3,false,true),a,{ease:'out',ry:30}),key(T1+d.strike*.5,atkPose(b,1,false,true),b,{ease:'out',ry:-170}),key(T2,atkPose(b,1,false,true),b,{ease:'out',ry:-360}),key(T3,atkPose(b,1,false,true),b,{ry:-360}),key(T4,IDLE,IDLE_BLADE,{ry:-360})],
  hits:[{s:T1,e:T2,shape:'blade',joint:'hR',r:.14,reach:1.9,dmg:25}],fx:[{t:T1,type:'sound',snd:'spin'},{t:T1,type:'trail',dur:.3}]};
}
function mkUnsheathe(){
 const st=clone(IDLE);st.hR=[-.13,.97,.24];st.hL=[-.2,.93,.12];for(const j of['pel','neck','head'])st[j][1]-=.22;st.neck[2]+=.14;st.head[2]+=.2;st.fL=[-.27,0,.4];st.fR=[.27,0,-.36];
 const sh=nrm3([.12,-.25,-1]),a1=dirAt(75,88),pull=dirAt(-125,88);
 return{name:'Katana · desenvaine',dur:1.4,loop:false,weapon:'katana',hurt:{r:.3,h:1.8},
  keys:[key(0,IDLE,IDLE_BLADE),key(.25,st,sh,{ease:'step'}),key(.7,st,sh,{ease:'out4'}),key(.73,atkPose(pull,.3),pull,{ease:'out4'}),key(.8,atkPose(a1,1),a1,{ease:'out',root:[0,0,1.4]}),key(.98,atkPose(a1,1),a1,{root:[0,0,1.4]}),key(1.4,IDLE,IDLE_BLADE,{root:[0,0,1.4]})],
  hits:[{s:.73,e:.8,shape:'blade',joint:'hR',r:.14,reach:1.9,dmg:40}],fx:[{t:.25,type:'sound',snd:'sheath'},{t:.73,type:'wave',amt:.7},{t:.73,type:'trail',dur:.1},{t:.75,type:'shake',amt:.5}]};
}
function mkRun(){
 const ks=[],N=4,dur=.6;
 for(let i=0;i<=N;i++){const ph=i/N*Math.PI*2,p=clone(IDLE);p.pel=[0,.92-Math.abs(Math.sin(ph))*.07,0];p.neck=[0,1.42,.3];p.head=[0,1.56,.36];
  p.fL=[-.13,Math.max(0,Math.cos(ph))*.28,Math.sin(ph)*.48];p.fR=[.13,Math.max(0,Math.cos(ph+Math.PI))*.28,Math.sin(ph+Math.PI)*.48];p.hL=[-.25,1.02,-Math.sin(ph)*.3+.05];p.hR=[.26,.95,0];
  ks.push(key(+(i/N*dur).toFixed(3),p,nrm3([.3,-.45,-.85]),{ease:'lin'}))}
 return{name:'Correr (ciclo)',dur,loop:true,weapon:'katana',keys:ks,hurt:{r:.3,h:1.8},hits:[]};
}
function mkIdle(){const a=clone(IDLE),b=clone(IDLE);for(const j of['pel','neck','head'])b[j][1]-=.025;b.neck[2]+=.01;
 return{name:'Reposo (ciclo)',dur:2,loop:true,weapon:'katana',keys:[key(0,a,IDLE_BLADE),key(1,b,IDLE_BLADE),key(2,a,IDLE_BLADE)],hurt:{r:.3,h:1.8},hits:[]}}

function newAnim(){const a={name:'Nueva animación '+(lib.anims.length+1),dur:1,loop:false,weapon:W_ORDER.includes(libGroup)?libGroup:'katana',slot:'none',live:false,fx:[],keys:[key(0,IDLE,IDLE_BLADE),key(1,IDLE,IDLE_BLADE)],hurt:{r:.3,h:1.8},hits:[]};lib.anims.push(a);lib.cur=lib.anims.length-1;T=0;selKey=null;commit();fillSel();tab='anim';setTab();toast('Animación creada')}

/* ============ PANELES ============ */
document.querySelectorAll('nav [data-tab]').forEach(b=>b.onclick=()=>{const d=$('dock');if(tab===b.dataset.tab){d.classList.toggle('fold')}else{d.classList.remove('fold');tab=b.dataset.tab;setTab()}setTimeout(resize,0)});
function setTab(){document.querySelectorAll('nav [data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));updateSelLabel();buildPanel()}
function buildPanelIfPose(){if(tab==='pose')buildPanel()}
const slider=(id,label,v,min,max,st,fmt)=>`<div class="row"><label for="${id}">${label}</label><input type="range" id="${id}" min="${min}" max="${max}" step="${st}" value="${v}"><span class="val" id="${id}_v">${fmt(v)}</span></div>`;
const f2=v=>(+v).toFixed(2),fs=v=>(+v).toFixed(2)+' s',fm=v=>(+v).toFixed(2)+' m',fd=v=>Math.round(v)+'°';
function bindSlider(id,fmt,onInput){const el=$(id);if(!el)return;el.addEventListener('input',()=>{$(id+'_v').textContent=fmt(el.value);onInput(+el.value)});el.addEventListener('change',commit)}
/* botones de elección (en vez de menús desplegables): chipRow pinta una fila, bindChips le pone la acción */
const chipRow=(id,opts,cur)=>`<div class="chips" id="${id}">${opts.map(([v,n])=>`<button type="button" data-v="${v}" class="${String(cur)===String(v)?'on':''}">${n}</button>`).join('')}</div>`;
function bindChips(id,fn){const el=$(id);if(!el)return;el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{el.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x===b));fn(b.dataset.v)})}
function buildPanel(){
 const a=A(),p=$('panel');
 if(tab==='pose'){
  const ki=keyAt(T),k=ki>=0?a.keys[ki]:null;
  p.innerHTML=`<p class="hint">${selJ?`<b>${JLABEL[selJ]}</b> seleccionado.`:'Toca un punto para moverlo: rojo articulaciones, rosa pecho, amarillo arma, blanco raíz. Activa “Codos y rodillas” para los puntos azules que deciden hacia dónde se doblan.'} Si mueves un punto donde no hay clave, se crea una sola. Usa Frente, Lado y Arriba para afinar.</p>
  ${k&&selJ&&JX.includes(selJ)&&k.p[selJ]?`<div class="btns"><button id="bAuto">${selJ==='chest'?'Pecho automático':'Dirección automática'}</button></div>`:''}
  ${k?`<div class="lbl">Curva hasta la siguiente clave</div>${chipRow('ease',Object.entries(EASES).map(([id,[n]])=>[id,n]),k.ease)}
  ${slider('ry','Giro del cuerpo',k.ry,-720,720,5,fd)}
  <p class="hint" style="margin-top:8px"><b>Arma</b>: sepárala de la mano (en la kusarigama se ve la cadena). La línea amarilla enseña su recorrido.</p>
  ${slider('we','Separar a lo largo del arma (m)',k.we||0,0,5,.05,v=>(+v).toFixed(2))}
  ${slider('wox','Mover arma ← → (m)',(k.wo||Z3)[0],-3,3,.05,v=>(+v).toFixed(2))}
  ${slider('woy','Mover arma ↓ ↑ (m)',(k.wo||Z3)[1],-3,3,.05,v=>(+v).toFixed(2))}
  ${slider('woz','Mover arma atrás / delante (m)',(k.wo||Z3)[2],-3,3,.05,v=>(+v).toFixed(2))}`:`<p class="hint">No hay clave en ${T.toFixed(2)} s. Pulsa “+ Clave” o mueve un punto.</p>`}
  <div class="btns"><button id="bCopy">Copiar pose</button><button id="bPaste">Pegar pose</button><button id="bMirror">Espejo</button><button id="bReset">Pose de reposo</button></div>
  ${slider('spd','Velocidad de reproducción',speed,.1,2,.05,v=>(+v).toFixed(2)+'×')}`;
  if(k){bindChips('ease',v=>{k.ease=v;commit()});bindSlider('ry',fd,v=>{k.ry=v});const f2=v=>(+v).toFixed(2),wo=()=>k.wo||(k.wo=[0,0,0]);bindSlider('we',f2,v=>{k.we=v});bindSlider('wox',f2,v=>{wo()[0]=v});bindSlider('woy',f2,v=>{wo()[1]=v});bindSlider('woz',f2,v=>{wo()[2]=v})}
  bindSlider('spd',v=>(+v).toFixed(2)+'×',v=>{speed=v});
  if($('bAuto'))$('bAuto').onclick=()=>{delete k.p[selJ];commit();buildPanel();toast('Vuelve a calcularse solo')};
  $('bCopy').onclick=()=>{const s=sampleRaw(a,T);poseClip={p:clone(s.p),blade:s.blade.slice(),rx:s.rx||0,rz:s.rz||0,we:s.we||0,wo:(s.wo||Z3).slice()};toast('Pose copiada')};
  $('bPaste').onclick=()=>{if(!poseClip)return toast('Primero copia una pose');const k2=ensureKey();k2.p=clone(poseClip.p);k2.blade=poseClip.blade.slice();k2.rx=poseClip.rx||0;k2.rz=poseClip.rz||0;k2.we=poseClip.we||0;k2.wo=(poseClip.wo||Z3).slice();commit();refreshKeyUI();toast('Pose pegada')};
  $('bMirror').onclick=()=>{const k2=ensureKey(),m=v=>[-v[0],v[1],v[2]],q=k2.p;const np={head:m(q.head),neck:m(q.neck),pel:m(q.pel),hL:m(q.hR),hR:m(q.hL),fL:m(q.fR),fR:m(q.fL)};if(q.chest)np.chest=m(q.chest);if(q.eR)np.eL=m(q.eR);if(q.eL)np.eR=m(q.eL);if(q.kR)np.kL=m(q.kR);if(q.kL)np.kR=m(q.kL);k2.p=np;k2.blade=m(k2.blade);commit();refreshKeyUI();toast('Pose reflejada')};
  $('bReset').onclick=()=>{const k2=ensureKey();k2.p=clone(IDLE);for(const j of JX)delete k2.p[j];k2.blade=IDLE_BLADE.slice();commit();refreshKeyUI()};
 }else if(tab==='fx'){
  const list=[...a.fx].sort((x,y)=>x.t-y.t);
  p.innerHTML=`<p class="hint">Los efectos se disparan en su momento al reproducir y en el juego. Triángulos azules en la regla de tiempo: tócalos para ir a ellos o arrástralos para moverlos.</p>
  <div class="lbl">Añadir en ${T.toFixed(2)} s</div><div class="chips" id="fxNew">${Object.entries(FXT).map(([k,v])=>`<button type="button" data-v="${k}">＋ ${v.n}</button>`).join('')}</div>
  ${list.length?'':'<p class="hint">Esta animación todavía no tiene efectos.</p>'}
  ${list.map(e=>{const i=a.fx.indexOf(e),d=FXT[e.type]||{n:e.type};return`<div class="card"${e===selFx?' style="border-color:#6fb6ff"':''}><h3>${d.n} · ${(+e.t).toFixed(2)} s</h3>
   ${slider('ft'+i,'Momento',e.t,0,a.dur,.01,fs)}
   ${d.j?`<div class="lbl">Dónde</div>${chipRow('fj'+i,Object.entries(FXJ),e.j||'tip')}`:''}
   ${d.amt?slider('fa'+i,'Intensidad',e.amt??.5,0,1,.05,v=>Math.round(v*100)+'%'):''}
   ${d.dur?slider('fd'+i,'Duración',e.dur??.15,.02,1.5,.01,fs):''}
   ${d.col?`<div class="lbl">Color</div>${chipRow('fc'+i,Object.entries(FXCOL).map(([k,[n]])=>[k,n]),e.col||'white')}`:''}
   ${d.snd?`<div class="lbl">Sonido</div>${chipRow('fs'+i,Object.entries(SOUNDS),e.snd||'swish')}`:''}
   <div class="btns"><button data-try="${i}">Probar</button><button data-go="${i}">Ir</button><button data-fdel="${i}">Eliminar</button></div></div>`}).join('')}`;
  bindChips('fxNew',t=>{const d=FXT[t],e={t:+T.toFixed(3),type:t};if(d.j)e.j='tip';if(d.amt)e.amt=.5;if(d.dur)e.dur=t==='trail'?.12:t==='hitstop'?.08:.3;if(d.col)e.col='white';if(d.snd)e.snd='swish';a.fx.push(e);selFx=e;commit();buildPanel();drawTL();initAudio();fireFx(e)});
  a.fx.forEach((e,i)=>{
   bindSlider('ft'+i,fs,v=>{e.t=v;T=v;$('tTime').textContent=T.toFixed(2)+' s';drawTL()});
   bindSlider('fa'+i,v=>Math.round(v*100)+'%',v=>e.amt=v);bindSlider('fd'+i,fs,v=>{e.dur=v;drawTL()});
   bindChips('fj'+i,v=>{e.j=v;commit()});bindChips('fc'+i,v=>{e.col=v;commit()});bindChips('fs'+i,v=>{e.snd=v;commit();initAudio();sfx(e.snd)});
  });
  p.querySelectorAll('[data-try]').forEach(b=>b.onclick=()=>{const e=a.fx[+b.dataset.try];selFx=e;T=e.t;refreshKeyUI();initAudio();fireFx(e)});
  p.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const e=a.fx[+b.dataset.go];selFx=e;T=e.t;playing=false;setPlayBtn();refreshKeyUI();buildPanel()});
  p.querySelectorAll('[data-fdel]').forEach(b=>b.onclick=()=>{a.fx.splice(+b.dataset.fdel,1);selFx=null;commit();buildPanel();drawTL()});
 }else if(tab==='col'){
  p.innerHTML=`<p class="hint">En rojo, las zonas que golpean (activas solo en su tramo de la línea de tiempo). En azul, el cuerpo que recibe daño.</p>
  <div class="card"><h3>Cuerpo (recibe daño)</h3>${slider('hr','Radio',a.hurt.r,.1,.8,.01,fm)}${slider('hh','Altura',a.hurt.h,.5,2.5,.01,fm)}</div>
  ${a.hits.map((h,i)=>`<div class="card"><h3>Golpe ${i+1}</h3>
   ${slider('hs'+i,'Empieza',h.s,0,a.dur,.01,fs)}${slider('he'+i,'Termina',h.e,0,a.dur,.01,fs)}
   <div class="lbl">Forma</div>${chipRow('sh'+i,[['blade','🗡 Hoja del arma'],['sphere','● Esfera en una articulación']],h.shape)}
   ${h.shape==='sphere'?`<div class="lbl">Articulación</div>${chipRow('jo'+i,['hR','hL','fR','fL','head','pel'].map(j=>[j,JLABEL[j]]),h.joint)}`:slider('re'+i,'Alcance',h.reach,.4,3,.05,fm)}
   ${slider('rr'+i,'Grosor',h.r,.03,.8,.01,fm)}
   <div class="row"><label for="dm${i}">Daño</label><input type="number" id="dm${i}" min="0" max="999" value="${h.dmg}"></div>
   <div class="btns"><button data-goto="${i}">Ir al inicio</button><button data-del="${i}">Eliminar golpe</button></div></div>`).join('')}
  <button id="bAddHit" class="acc">+ Golpe en ${T.toFixed(2)} s</button>`;
  bindSlider('hr',fm,v=>a.hurt.r=v);bindSlider('hh',fm,v=>a.hurt.h=v);
  a.hits.forEach((h,i)=>{
   bindSlider('hs'+i,fs,v=>{h.s=Math.min(v,h.e);drawTL()});bindSlider('he'+i,fs,v=>{h.e=Math.max(v,h.s);drawTL()});
   bindSlider('rr'+i,fm,v=>h.r=v);bindSlider('re'+i,fm,v=>h.reach=v);
   bindChips('sh'+i,v=>{h.shape=v;commit();buildPanel()});bindChips('jo'+i,v=>{h.joint=v;commit()});
   $('dm'+i).onchange=e=>{h.dmg=clamp(+e.target.value||0,0,999);commit()};
  });
  p.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{a.hits.splice(+b.dataset.del,1);commit();buildPanel();drawTL()});
  p.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{T=a.hits[+b.dataset.goto].s;refreshKeyUI()});
  $('bAddHit').onclick=()=>{a.hits.push({s:+T.toFixed(3),e:+Math.min(a.dur,T+.1).toFixed(3),shape:'blade',joint:'hR',r:.12,reach:1.6,dmg:20});commit();buildPanel();drawTL()};
 }else{
  const L=layerOf(a),pc=v=>Math.round(v*100)+'%';
  p.innerHTML=`<div class="row"><label for="nm">Nombre</label><input type="text" id="nm" value="${esc(a.name)}" maxlength="60"></div>
  ${slider('du','Duración (escala claves)',a.dur,.2,5,.05,fs)}
  <div class="lbl">Arma</div>${chipRow('wp',[...W_ORDER.map(w=>[w,W_N[w]]),['none','Sin arma']],a.weapon)}
  <label class="chk"><input type="checkbox" id="lp"${a.loop?' checked':''}> Repetir en bucle</label>
  ${a.loop?'':`<div class="card"><h3>Mezcla por capas</h3><p class="hint">Cuánto manda este ataque sobre cada parte del cuerpo cuando corres. Quieto, el ataque se ve tal cual lo animaste. Usa “Mezclar con correr” para verlo.</p>
   ${slider('la','Brazos y arma',L.arms,0,1,.05,pc)}${slider('lh','Cabeza y cuello',L.head,0,1,.05,pc)}${slider('lc','Pecho',L.chest,0,1,.05,pc)}${slider('lpv','Pelvis',L.pel,0,1,.05,pc)}${slider('ll','Piernas',L.legs,0,1,.05,pc)}
   ${slider('li','Entrada suave',L.in,0,.5,.01,fs)}${slider('lo','Salida suave',L.out,0,.8,.01,fs)}${slider('lm','Moverse al atacar',L.move,0,1,.05,pc)}</div>`}
  <div class="card"><h3>En el juego</h3>
   <div class="lbl">Se usa como</div>${chipRow('sl',Object.entries(SLOTS),a.slot||'none')}
   <label class="chk"><input type="checkbox" id="lv"${a.live?' checked':''}${(a.slot||'none')==='none'?' disabled':''}> Usar esta animación al jugar</label>
   ${(()=>{const o=lib.anims.filter(x=>x!==a&&x.live&&x.slot===a.slot&&a.slot&&a.slot!=='none');return o.length&&a.live?`<p class="hint">Otra animación también está activa para “${SLOTS[a.slot]}”: el juego usa la última de la lista.</p>`:''})()}
   <p class="hint">Al editar una animación con uso asignado se activa sola. Pulsa “Jugar” para probarla.</p></div>
  <div class="btns"><button id="bDup">Duplicar</button><button id="bDelA">Eliminar animación</button></div>
  <div class="card"><h3>Exportar</h3><p class="hint">Mismo formato de articulaciones que el juego.</p><textarea id="ex" readonly></textarea>
   <div class="btns"><button id="bExA">Esta animación</button><button id="bExAll">Todas</button><button id="bCopyEx" class="acc">Copiar</button></div></div>
  <div class="card"><h3>Importar</h3><textarea id="im" placeholder="Pega aquí el JSON exportado"></textarea><div class="btns"><button id="bIm" class="acc">Importar</button><button id="bDefaults">Recuperar ejemplos del juego</button></div></div>
  <p class="hint">Tus animaciones se guardan solo en este navegador. Exporta el JSON para tener una copia o llevarlas a otro dispositivo.</p>`;
  if(!a.loop){const LL=()=>{a.layer=a.layer||{...LAYER_DEF};return a.layer};
   for(const[id,k,f]of[['la','arms',pc],['lh','head',pc],['lc','chest',pc],['lpv','pel',pc],['ll','legs',pc],['li','in',fs],['lo','out',fs],['lm','move',pc]])bindSlider(id,f,v=>{LL()[k]=v})}
  $('nm').oninput=e=>{a.name=e.target.value||'Sin nombre';fillSel()};$('nm').onchange=commit;
  let baseDur=a.dur,baseKeys=null,baseHits=null;
  $('du').addEventListener('pointerdown',()=>{baseDur=a.dur;baseKeys=a.keys.map(k=>k.t);baseHits=a.hits.map(h=>[h.s,h.e])});
  bindSlider('du',fs,v=>{if(!baseKeys){baseDur=a.dur;baseKeys=a.keys.map(k=>k.t);baseHits=a.hits.map(h=>[h.s,h.e])}const f=v/baseDur;a.dur=v;a.keys.forEach((k,i)=>k.t=+(baseKeys[i]*f).toFixed(3));a.hits.forEach((h,i)=>{h.s=+(baseHits[i][0]*f).toFixed(3);h.e=+(baseHits[i][1]*f).toFixed(3)});T=Math.min(T,v);drawTL()});
  $('du').addEventListener('change',()=>{baseKeys=null});
  bindChips('wp',v=>{a.weapon=v;commit();fillSel()});
  bindChips('sl',v=>{a.slot=v;if(a.slot==='none')a.live=false;commit();buildPanel()});
  $('lv').onchange=e=>{a.live=e.target.checked;a._off=!a.live;snap='';commit();buildPanel()};$('lp').onchange=e=>{a.loop=e.target.checked;commit()};
  $('bDup').onclick=()=>{const c=clone(a);c.name=a.name+' (copia)';lib.anims.splice(lib.cur+1,0,c);lib.cur++;commit();fillSel();buildPanel();toast('Duplicada')};
  $('bDelA').onclick=()=>{if(lib.anims.length<=1)return toast('Debe quedar al menos una');const b=$('bDelA');if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Pulsa otra vez para eliminar';return}lib.anims.splice(lib.cur,1);lib.cur=Math.max(0,lib.cur-1);T=0;commit();fillSel();buildPanel();drawTL();toast('Eliminada (puedes deshacer)')};
  const ex=$('ex');const showEx=all=>{ex.value=JSON.stringify(all?{anims:lib.anims}:a)};showEx(false);
  $('bExA').onclick=()=>showEx(false);$('bExAll').onclick=()=>showEx(true);
  $('bCopyEx').onclick=async()=>{try{await navigator.clipboard.writeText(ex.value);toast('Copiado al portapapeles')}catch(e){ex.focus();ex.select();toast('Selecciona y copia el texto')}};
  $('bIm').onclick=()=>{try{const d=JSON.parse($('im').value);const list=Array.isArray(d.anims)?d.anims:[d];const ok=list.filter(x=>x&&Array.isArray(x.keys)&&x.keys.length&&x.keys.every(k=>k.p&&JN.every(j=>Array.isArray(k.p[j]))));
   if(!ok.length)throw 0;for(const x of ok){x.name=String(x.name||'Importada').slice(0,60);x.dur=clamp(+x.dur||1,.1,10);x.hurt=x.hurt||{r:.3,h:1.8};x.hits=Array.isArray(x.hits)?x.hits:[];x.fx=Array.isArray(x.fx)?x.fx:[];x.weapon=x.weapon||'katana';x.keys.forEach(k=>{k.blade=k.blade||IDLE_BLADE.slice();k.root=k.root||[0,0,0];k.ry=k.ry||0;k.ease=EASES[k.ease]?k.ease:'inout'});sortKeys(x);lib.anims.push(x)}
   lib.cur=lib.anims.length-1;commit();fillSel();buildPanel();drawTL();toast(ok.length+' animación(es) importada(s)')}catch(e){toast('El JSON no es válido')}};
  $('bDefaults').onclick=()=>{const d=defaults();lib.anims.push(...d.anims);commit();fillSel();toast('Ejemplos añadidos al final')};
 }
}

/* ============ BUCLE ============ */
function resize(){const r=$('view').getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(1,r.height);camera.clearViewOffset();camera.updateProjectionMatrix();drawTL()}
addEventListener('resize',resize);new ResizeObserver(resize).observe($('view'));
let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(playing){const a=A(),t0=T;let adv=dt*speed;if(holdT>0){holdT-=dt;adv=0}else if(slowT>0){slowT-=dt;adv*=.3}T+=adv;let wrapped=false;if(T>=a.dur){if(a.loop){T%=a.dur;wrapped=true}else{T=a.dur;playing=false;setPlayBtn()}}if(adv>0)fireBetween(t0===0&&!wrapped?-1e-6:t0,T);$('tTime').textContent=T.toFixed(2)+' s';drawTL()}
 sbStep(dt);fxStep(dt);pMat.uniforms.uScale.value=renderer.domElement.height/(2*Math.tan(camera.fov*D2R/2));
 render();requestAnimationFrame(loop);
}
fillSel();buildPanel();resize();updateSelLabel();requestAnimationFrame(loop);

}
</script>
