<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17151b">
<title>Estilo tinta · shaders</title>
<style>
/* Banco de pruebas del estilo tinta: una escena como la del juego (suelo, edificios con sombra, protagonista y zombis) y todos los
   ajustes de models/inkstyle.js agrupados y plegables. Misma estética que el editor. Vista arriba, ajustes abajo (móvil). */
:root{color-scheme:dark;--bg:#17151b;--panel:#211e26;--line:#3a3540;--ink:#ece6dd;--dim:#a49b92;--acc:#d1242c;--acc2:#f0c35a}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;height:100dvh}
#view{position:relative;flex:1 1 55%;min-height:220px;touch-action:none}
#view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#top{position:absolute;left:6px;right:6px;top:6px;display:flex;gap:6px;flex-wrap:wrap;z-index:3}
#top a,#top button{min-height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:rgba(33,30,38,.9);color:var(--ink);font:650 14px system-ui;display:inline-flex;align-items:center;text-decoration:none}
#top .on{background:#3d2a2e;border-color:var(--acc);color:#fff}
#cmp{position:absolute;left:8px;bottom:8px;z-index:3;font-size:12px;color:#fff;background:var(--acc);padding:4px 10px;border-radius:8px;display:none}
#dock{flex:0 0 auto;max-height:46dvh;overflow:auto;background:var(--panel);border-top:1px solid var(--line);padding:6px 12px 18px}
details{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#26222b}
summary{min-height:44px;display:flex;align-items:center;padding:0 12px;font-weight:700;cursor:pointer;list-style:none}
summary::after{content:'▾';margin-left:auto;color:var(--dim)}
details[open] summary::after{content:'▴'}
details .in{padding:0 12px 8px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row>label{flex:0 0 9em;color:var(--dim);font-size:13px}
.row input[type=range]{flex:1;accent-color:var(--acc);height:30px}
.row input[type=color]{width:56px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#2c2832}
.val{min-width:4.2em;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.chk{display:flex;align-items:center;gap:8px;min-height:44px}.chk input{width:22px;height:22px;accent-color:var(--acc)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
button,textarea{font:inherit;color:var(--ink);background:#2c2832;border:1px solid var(--line);border-radius:10px}
button{min-height:42px;padding:0 12px;font-weight:650}button:active{background:#3a3540}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
.reset{min-height:32px;font-size:12px;padding:0 8px;color:var(--dim)}
.hint{color:var(--dim);font-size:13px;margin:4px 0}
textarea{width:100%;min-height:70px;padding:8px;font:12px/1.4 ui-monospace,monospace}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
</style>
</head>
<body>
<div id="app">
 <div id="view">
  <canvas id="cv"></canvas>
  <div id="top">
   <a href="editor.html">← Editor</a><a href="modelo.html">🧍 Modelo</a>
   <button id="bInk" class="on">🖌 Tinta</button><button id="bCmp">◐ Mantén: antes</button><button id="bAsh" class="on">🔥 Ceniza</button><button id="bRot">⟳ Girar</button>
  </div>
  <div id="cmp">Sin estilo tinta</div>
 </div>
 <div id="dock">
  <p class="hint">Cada cambio se guarda en este dispositivo y el juego (abierto desde el mismo sitio) lo usa al momento. Arrastra la escena para girarla; pellizca para acercar. Para dejarlo fijo para todos, copia los ajustes y pásamelos.</p>
  <div id="groups"></div>
  <div class="btns"><button id="sCopy">📋 Copiar ajustes</button><button id="sPaste">📥 Pegar ajustes</button><button id="sReset">↺ Todo por defecto</button></div>
  <textarea id="sJson" placeholder="Aquí aparecen (o pegas) los ajustes en JSON"></textarea>
 </div>
</div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="models/inkstyle.js?v=20261128f"></script>
<script src="models/zmodel.js?v=20261128f"></script>
<script>
{
'use strict';
const $=id=>document.getElementById(id);
// aviso visible en vez de pantalla negra
const warn=t=>{const e=$('cmp');e.textContent=t+' · recarga la página en unos minutos';e.style.display='block';e.dataset.err=1};
addEventListener('error',e=>warn('Error: '+e.message));
const toast=t=>{const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,1600)};
/* qué hace cada grupo (texto corto encima de sus ajustes) */
const HELP={Paleta:'Colores del escenario y la niebla.',Luz:'Cuánta luz de cielo y de sol: mueve qué cae en cada tono.',Tonos:'Las 3 manchas de tinta (sombra, medio, iluminado) y dónde corta cada una.',
 Contorno:'La línea de tinta alrededor de los cuerpos.',Enemigos:'Gris de los zombis y su brillo propio.',Protagonista:'Guerrero en tinta aguada: papel, tinta, grano, borde a pincel y rojo.',Ceniza:'El borde de brasa al morir (activa 🔥 Ceniza).'};
/* ---------- escena parecida al juego ---------- */
const cv=$('cv'),renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color();scene.fog=new THREE.Fog(0,16,62);
const camera=new THREE.PerspectiveCamera(50,1,.05,200);
const hemi=new THREE.HemisphereLight(0xffffff,0x8d8478,1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(-6,12,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:40});sun.shadow.bias=-.0008;scene.add(sun);
const ORIG={paper:0xd4b199,ground:0xb48f78,tiles:0x9c7965,side:0x3d3743,top:0x62565c,sun:0xd0503f,hemiS:0xfff0dc,hemiG:0x5e4038,hemiI:.8,sunI:.85};
const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial());ground.receiveShadow=true;scene.add(ground);
const tiles=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints((()=>{const p=[];for(let i=-20;i<=20;i+=2)p.push(new THREE.Vector3(i,.005,-20),new THREE.Vector3(i,.005,20),new THREE.Vector3(-20,.005,i),new THREE.Vector3(20,.005,i));return p})()),new THREE.LineBasicMaterial({transparent:true,opacity:.5}));scene.add(tiles);
const mSide=new THREE.MeshLambertMaterial(),mTop=new THREE.MeshLambertMaterial();
for(const [x,z,w,d,h] of [[-3.2,-2.5,2,2,3.2],[3,-3.5,2.5,1.6,1.4],[2.8,2.2,1.2,1.2,.9]]){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[mSide,mSide,mTop,mSide,mSide,mSide]);m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m)}
const disc=new THREE.Mesh(new THREE.CircleGeometry(6,40),new THREE.MeshBasicMaterial({fog:false}));disc.position.set(10,14,-40);scene.add(disc);
/* poses: las del stickman de pie y la del zombi (brazos al frente), con un leve balanceo */
const IDLE=[[0,1.59,.06],[0,1.44,.04],[0,1.21,.02],[0,.89,0],[-.17,1.2,.04],[-.1,1.03,.28],[.18,1.2,.04],[.15,1,.26],[-.08,.46,.17],[-.16,0,.16],[.08,.43,.05],[.16,0,-.12]];
const ZPOSE=IDLE.map(p=>p.slice());ZPOSE[4]=[-.16,1.3,.18];ZPOSE[5]=[-.14,1.3,.48];ZPOSE[6]=[.16,1.3,.18];ZPOSE[7]=[.14,1.28,.5];ZPOSE[0]=[0,1.55,.12];
function world(L,x,z,yaw,t,sw){const c=Math.cos(yaw),s=Math.sin(yaw);return L.map((l,i)=>{const b=i<3?Math.sin(t*1.7+sw)*.03:0,lx=l[0]+(i===5||i===7?Math.sin(t*2+sw)*.04:0),lz=l[2]+b;return[x-c*lx+s*lz,l[1]+(i<3?Math.sin(t*2.4+sw)*.01:0),z+s*lx+c*lz]})}
const ZOMBIES=[[-1.6,1.4,2.7],[1.5,1.8,3.6],[-.4,2.8,3.1],[2.4,.4,4.1],[-2.6,.2,2.2],[.9,3.4,3.3]];
const ZCOL=[0x252525,0x2e2e2e,0x1d1d1d,0x2a2d24,0x272b22,0x312f2a].map(c=>new THREE.Color(c)),ZBASE=new THREE.Color(0x7d8c6a),tcol=new THREE.Color();
/* palos (como el stickman sin modelo) con su contorno de tinta: casco invertido igual que en el juego */
const stickMat=new THREE.MeshLambertMaterial({color:0xf1ebe2}),outMat=new THREE.MeshBasicMaterial({side:THREE.BackSide});
outMat.onBeforeCompile=sh=>{sh.uniforms.inkW=INKS.u.wSticks;sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nuniform float inkW;').replace('#include <begin_vertex>','vec3 transformed=position+normalize(normal+1e-6)*inkW;')};
const cylG=new THREE.CylinderGeometry(1,1,1,8),sphG=new THREE.SphereGeometry(1,12,8),BONES=[[0,1],[1,2],[2,3],[1,4],[4,5],[1,6],[6,7],[3,8],[8,9],[3,10],[10,11]];
const stick=BONES.map(()=>{const g=new THREE.Group(),a=new THREE.Mesh(cylG,stickMat),b=new THREE.Mesh(cylG,outMat);g.add(a,b);a.castShadow=true;scene.add(g);return{g,b}});
const sHead=new THREE.Group(),sh1=new THREE.Mesh(sphG,stickMat),sh2=new THREE.Mesh(sphG,outMat);sHead.add(sh1,sh2);scene.add(sHead);
const Yv=new THREE.Vector3(0,1,0),tv=new THREE.Vector3();
function drawStick(J){BONES.forEach(([a,b],i)=>{const A=new THREE.Vector3(...J[a]),B=new THREE.Vector3(...J[b]),g=stick[i].g,L=A.distanceTo(B);g.position.copy(A).add(B).multiplyScalar(.5);g.quaternion.setFromUnitVectors(Yv,tv.subVectors(B,A).normalize());g.scale.set(.055,L,.055)});
 sHead.position.set(...J[0]);sHead.scale.setScalar(.15);const on=INKS.u.on.value>.5;stick.forEach(s=>s.b.visible=on);sh2.visible=on}
/* ---------- aplicar ajustes ---------- */
const st={ink:true,ash:true,rot:false,hold:false};
function apply(){const v=INKS.v,on=st.ink&&!st.hold;INKS.u.on.value=on?1:0;
 const c=(k,o)=>on?new THREE.Color(v[k]):new THREE.Color(ORIG[o]);
 scene.background.copy(c('paper','paper'));scene.fog.color.copy(scene.background);scene.fog.near=on?v.fogNear:16;scene.fog.far=on?v.fogFar:62;
 ground.material.color.copy(c('ground','ground'));tiles.material.color.copy(c('tiles','tiles'));mSide.color.copy(c('side','side'));mTop.color.copy(c('top','top'));disc.material.color.copy(c('sun','sun'));
 hemi.color.set(on?0xffffff:ORIG.hemiS);hemi.groundColor.set(on?0x8d8478:ORIG.hemiG);hemi.intensity=on?v.hemi:ORIG.hemiI;sun.intensity=on?v.sunI:ORIG.sunI;
 outMat.color.set(v.outCol);ZM.ink=ZMP.ink=on;INKS.scan(scene);if(!$('cmp').dataset.err){$('cmp').textContent='Sin estilo tinta';$('cmp').style.display=st.hold?'block':'none'}}
INKS.onChange(apply);
/* ---------- panel de ajustes: un grupo plegable por tema ---------- */
function buildPanel(){const v=INKS.v,groups={},d0={};for(const d of INKS.DEF){(groups[d[1]]=groups[d[1]]||[]).push(d);d0[d[0]]=d[4]}
 const fmt=s=>x=>(+x).toFixed(s>=1?0:s>=.1?1:s>=.01?2:3);let h='',first=true;
 for(const g in groups){h+=`<details${first?' open':''}><summary>${g}</summary><div class="in"><p class="hint">${HELP[g]||''}</p>`;first=false;
  for(const [k,,lab,ty,def,mn,mx,s] of groups[g]){const id='k_'+k;
   if(ty==='color')h+=`<div class="row"><label for="${id}">${lab}</label><input type="color" id="${id}" value="${v[k]}"><span class="val">${v[k]}</span></div>`;
   else if(ty==='bool')h+=`<label class="chk"><input type="checkbox" id="${id}"${v[k]?' checked':''}> ${lab}</label>`;
   else h+=`<div class="row"><label for="${id}">${lab}</label><input type="range" id="${id}" min="${mn}" max="${mx}" step="${s}" value="${v[k]}"><span class="val" id="${id}_v">${fmt(s)(v[k])}</span></div>`}
  h+=`<button class="reset" data-g="${g}">↺ Este grupo por defecto</button></div></details>`}
 $('groups').innerHTML=h;
 for(const [k,,,ty,,,,s] of INKS.DEF){const el=$('k_'+k);if(!el)continue;
  if(ty==='color')el.addEventListener('input',()=>{el.nextElementSibling.textContent=el.value;INKS.set(k,el.value)});
  else if(ty==='bool')el.addEventListener('change',()=>INKS.set(k,el.checked));
  else{const f=fmt(s);el.addEventListener('input',()=>{$('k_'+k+'_v').textContent=f(el.value);INKS.set(k,+el.value)})}}
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{for(const d of groups[b.dataset.g])INKS.v[d[0]]=d0[d[0]];INKS.sync();INKS.save();const open=[...document.querySelectorAll('details')].map(x=>x.open);buildPanel();document.querySelectorAll('details').forEach((x,i)=>x.open=open[i]);toast('Grupo «'+b.dataset.g+'» por defecto')})}
$('sCopy').onclick=async()=>{const j=INKS.json();$('sJson').value=j;try{await navigator.clipboard.writeText(j);toast('Ajustes copiados')}catch(_){toast('Cópialos del cuadro de texto')}};
$('sPaste').onclick=()=>{try{const o=JSON.parse($('sJson').value||'{}');for(const k in o)if(k in INKS.v)INKS.v[k]=o[k];INKS.sync();INKS.save();buildPanel();toast('Ajustes aplicados')}catch(_){toast('El texto no es un JSON válido')}};
$('sReset').onclick=()=>{if(!confirm('¿Volver todos los ajustes a sus valores por defecto?'))return;INKS.reset();buildPanel();toast('Valores por defecto')};
$('bInk').onclick=()=>{st.ink=!st.ink;$('bInk').classList.toggle('on',st.ink);apply()};
$('bAsh').onclick=()=>{st.ash=!st.ash;$('bAsh').classList.toggle('on',st.ash)};
$('bRot').onclick=()=>{st.rot=!st.rot;$('bRot').classList.toggle('on',st.rot)};
const hold=v=>()=>{st.hold=v;apply()};$('bCmp').addEventListener('pointerdown',hold(true));for(const e of['pointerup','pointerleave','pointercancel'])$('bCmp').addEventListener(e,hold(false));
/* ---------- cámara ---------- */
const orb={th:.5,ph:.95,r:7.5,tg:new THREE.Vector3(0,.8,1.8)},ptrs=new Map();let drag=null,pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),r:orb.r};drag=null}else drag={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointermove',e=>{if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];orb.r=Math.min(25,Math.max(1.5,pinch.r*pinch.d/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))));return}
 if(!drag)return;orb.th-=(e.clientX-drag.x)*.008;orb.ph=Math.min(1.5,Math.max(.2,orb.ph-(e.clientY-drag.y)*.006));drag.x=e.clientX;drag.y=e.clientY});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;drag=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{orb.r=Math.min(25,Math.max(1.5,orb.r*(1+Math.sign(e.deltaY)*.1)))},{passive:true});
/* ---------- bucle ---------- */
function resize(){const r=$('view').getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(1,r.height);camera.updateProjectionMatrix()}
addEventListener('resize',resize);new ResizeObserver(resize).observe($('view'));
function loop(ms){requestAnimationFrame(loop);try{loopBody(ms)}catch(e){warn('Error: '+e.message)}}
function loopBody(ms){const t=ms/1000;if(st.rot)orb.th+=.004;
 camera.position.set(orb.tg.x+orb.r*Math.sin(orb.ph)*Math.sin(orb.th),orb.tg.y+orb.r*Math.cos(orb.ph),orb.tg.z+orb.r*Math.sin(orb.ph)*Math.cos(orb.th));camera.lookAt(orb.tg);
 if(ZMP.ready){ZMP.begin();ZMP.add(world(IDLE,0,.6,0,t,0),0,1,null,null);ZMP.end()}
 if(ZM.ready){ZM.begin();ZOMBIES.forEach(([x,z,y],i)=>{const yaw=Math.atan2(0-x,.6-z);const col=INKS.u.on.value>.5?INKS.tone(ZCOL[i],tcol):ZCOL[i];
   const dis=st.ash&&i===0?Math.min(1,Math.max(0,((t%2.4)-.6)/1.2)):0;ZM.add(world(ZPOSE,x,z,yaw,t,i*1.3),yaw,1,null,col,dis)});ZM.end()}
 drawStick(world(IDLE,-1.1,-.4,.4,t,2));renderer.render(scene,camera)}
resize();try{buildPanel();apply()}catch(e){warn('Archivos a medio actualizar: recarga la página en unos minutos ('+e.message+')')}
requestAnimationFrame(loop);Promise.all([ZM.load('models/zombie.glb',scene),ZMP.load('models/player.glb',scene)]).then(r=>{apply();if(r.includes(false))warn('No se pudo cargar algún modelo: recarga en unos minutos')});
}
</script>
</body>
</html>
