   pitchVar · cada sonido varía un poco de tono y volumen, para que 20 bajas seguidas no suenen idénticas

 if(d>mx){const k=mx/d;dx*=k;dy*=k;dz*=k;d=mx;b=[a[0]+dx,a[1]+dy,a[2]+dz]}
 const ux=dx/d,uy=dy/d,uz=dz/d,x=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-x*x));

 return[[a[0]+ux*x+px/pl*h,a[1]+uy*x+py/pl*h,a[2]+uz*x+pz/pl*h],b];
}

 for(const d in G.duo)K.duo[d]=1;for(const s in G.shinpo)K.sp[s]=1;

  if(st.spc)SM.spc*=1+st.spc*n;if(st.jmp)K.jmp=(K.jmp||0)+st.jmp*n;if(st.dcd)K.dcd=(K.dcd||0)+st.dcd*n;if(st.rng)SM.rng*=1+st.rng*n}

 case'katana':return src==='kiri'&&P.lastStep===2;
 case'maza':return(src==='tame'&&P.tameFull)||e.stun>0||(e.ks&&e.ks.frz>0);
 case'naginata':return!!(P.atk&&P.atk.hitE&&P.atk.hitE.size>=3)||(src==='tame');
 case'shuriken':return!!(e.ks&&(e.ks.bn>0||e.ks.wd>0));
 case'yari':return d>=2.3;
 case'nito':return(P.streak||0)>=8;
 case'yumi':return!!(hit.big||(e.arrN||0)>=2);
 case'kama':return kgBehind(e);

 const src=hit.src||(hit.src=kgSrc(hit)),W=weapon().id;let d=base*(src==='proc'?1:SM.dmg),crit=0;

 const sk=KS.slot.kiri;if(src==='kiri'&&sk){if(sk.ka==='fujin')d*=1+.4*sk.v;else if(sk.ka==='hachi'||sk.ka==='benzai')d*=1+.5*sk.v}

 if(P.iaiX&&src==='tame'){d*=3;crit=Math.max(crit,1)}

   Cada uno mueve a su personaje y tiene su propia cámara; se envía la pose 20 veces por segundo y el anfitrión la reparte.
   Para pruebas en un mismo dispositivo: añade ?bc=1 a la dirección (usa BroadcastChannel entre pestañas). */
const NET={on:false,host:false,code:'',id:'',slot:0,peers:{},conns:{},peer:null,bc:null,sendT:0,status:'',max:4};
const MP_COL=['#ff5a4a','#4aa3ff','#ffb020','#4be36b'];
const mpColor=s=>new THREE.Color(MP_COL[s%4]);
function mpCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=A[(Math.random()*A.length)|0];return c}
function loadPeerJS(){return new Promise((ok,ko)=>{if(window.Peer)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';s.onload=()=>ok();s.onerror=()=>ko(new Error('No se pudo cargar la conexión'));document.head.appendChild(s)})}
const useBC=/[?&]bc=1/.test(location.search);
function mpSend(to,m){m.from=NET.id;
 if(NET.bc){m.to=to;NET.bc.postMessage(m);return}
 if(to==='all'){for(const k in NET.conns){try{NET.conns[k].send(m)}catch(_){}}}
 else{const c=NET.conns[to];if(c)try{c.send(m)}catch(_){}}}
function mpRoster(){return[{id:NET.id,name:playerName,slot:NET.slot}].concat(Object.values(NET.peers).map(p=>({id:p.id,name:p.name,slot:p.slot})))}
function mpOnMsg(m,conn){if(!m||m.from===NET.id)return;if(NET.bc&&m.to!=='all'&&m.to!==NET.id)return;
 if(NET.host){
  if(m.t==='hello'){const used=new Set([0].concat(Object.values(NET.peers).map(p=>p.slot)));
   if(Object.keys(NET.peers).length>=NET.max-1){mpSend(m.from,{t:'full'});return}
   let s=1;while(used.has(s))s++;NET.peers[m.from]={id:m.from,name:cleanName(m.name)||'Jugador',slot:s,st:null,J:null};if(conn)NET.conns[m.from]=conn;
   mpSend(m.from,{t:'welcome',slot:s,ver:GAME_VER});if(m.ver!==GAME_VER)setTimeout(()=>banner('⚠ '+NET.peers[m.from].name+' tiene la v'+(m.ver||'?')+' (tú v'+GAME_VER+')'),2400);if(NET.match&&NET.match.on){const M=NET.match;M.score[m.from]={k:0,d:0};setTimeout(()=>mpSend(m.from,{t:'start',mode:M.mode,goal:M.goal,time:Math.ceil(M.t),score:M.score,picks:Object.values(NET.picks).map(q=>({id:q.id,x:q.x,y:q.y,z:q.z,item:q.item}))}),300)}mpSend('all',{t:'roster',list:mpRoster()});mpStatus();banner('👥 '+NET.peers[m.from].name+' ha entrado');sfx('ready');return}
  if(m.t==='s'&&NET.peers[m.from]){mpApply(m.from,m.st);for(const k in NET.peers)if(k!==m.from)mpSend(k,{t:'s',id:m.from,st:m.st});return}
  if(m.t==='bye')return mpDrop(m.from);
  if(m.t==='hit'||m.t==='parried'||m.t==='deflect'||m.t==='die'||m.t==='wtake'||m.t==='shot')return mpHostHandle(m)}
 else{
  if(m.t==='welcome'){if(m.ver!==GAME_VER)setTimeout(()=>banner('⚠ El anfitrión tiene la v'+(m.ver||'?')+' (tú v'+GAME_VER+'). Actualizad todos'),1500);NET.hostIdGuess=m.from;NET.slot=m.slot;NET.joined=true;mpEnter();return}
  if(m.t==='full'){mpFail('La sala está llena (máximo 4)');return}
  if(m.t==='roster'){const keep={};for(const r of m.list){if(r.id===NET.id)continue;keep[r.id]=1;const p=NET.peers[r.id]||(NET.peers[r.id]={id:r.id,st:null,J:null});p.name=r.name;p.slot=r.slot}for(const k in NET.peers)if(!keep[k])mpRemove(k);mpStatus();return}
  if(m.t==='s'){const id=m.id||m.from;if(!NET.peers[id])NET.peers[id]={id,name:'…',slot:1,st:null,J:null};mpApply(id,m.st);return}
  if(m.t==='close'){mpFail('El anfitrión ha cerrado la sala');return}
  if(['hit','parried','deflect','kf','score','start','end','free','wspawn','wgone','shot'].includes(m.t))return mpDeliver(m)}}
function mpApply(id,st){const p=NET.peers[id];if(!p||!st)return;p.st=st;p.seen=performance.now();const hh=p.hist||(p.hist=[]);hh.push([p.seen,st.J[3][0],Math.min(st.J[9][1],st.J[11][1])-.05,st.J[3][2]]);while(hh.length>30)hh.shift();if(!p.J||Math.hypot(st.J[3][0]-p.J[3][0],st.J[3][2]-p.J[3][2])>3)p.J=st.J.map(q=>q.slice())}
function mpRemove(id){const p=NET.peers[id];if(!p)return;if(p.tag)p.tag.remove();if(p.meshes)for(const k in p.meshes)scene.remove(p.meshes[k]);delete NET.peers[id];delete NET.conns[id]}
function mpDrop(id){const p=NET.peers[id];if(!p)return;banner('👥 '+p.name+' ha salido');mpRemove(id);if(NET.host)mpSend('all',{t:'roster',list:mpRoster()});mpStatus()}
async function mpStart(host,code){mpLeave(true);NET.host=host;NET.code=(code||mpCode()).toUpperCase();NET.peers={};NET.conns={};NET.slot=host?0:-1;NET.joined=host;NET.on=true;
 mpScreen(host?'Creando sala…':'Conectando a '+NET.code+'…');
 if(useBC){NET.id=(host?'H':'C')+Math.random().toString(36).slice(2,8);NET.bc=new BroadcastChannel('stickronin-'+NET.code);NET.bc.onmessage=e=>mpOnMsg(e.data);
  if(host){NET.hostId=NET.id;mpEnter()}else{mpSend('all',{t:'hello',name:playerName,ver:GAME_VER});NET.joinTO=setTimeout(()=>{if(!NET.joined)mpFail('No se encuentra la sala '+NET.code)},4000)}return}
 try{await loadPeerJS()}catch(e){mpFail(/claude\.ai|claudeusercontent/.test(location.href)?'Desde el enlace de Claude no se puede conectar. Abre el juego en dsmethy-meshed.github.io/stick-ronin':'No hay conexión a internet para encontrar la sala');return}
 const pid='stickronin-'+NET.code;
 const peer=host?new Peer(pid):new Peer();NET.peer=peer;
 peer.on('error',err=>{if(err&&err.type==='unavailable-id')mpFail('Ese código ya está en uso, vuelve a crear la sala');else if(err&&err.type==='peer-unavailable')mpFail('No existe la sala '+NET.code);else if(NET.on)mpFail('Error de conexión'+(err&&err.type?' ('+err.type+')':''))});
 peer.on('open',id=>{NET.id=id;
  if(host){NET.hostId=id;peer.on('connection',c=>{c.on('data',d=>mpOnMsg(d,c));c.on('close',()=>{for(const k in NET.conns)if(NET.conns[k]===c)mpDrop(k)})});mpEnter()}
  else{const c=peer.connect(pid,{serialization:'json'});NET.conns.host=c;
   c.on('open',()=>{c.send({t:'hello',name:playerName,ver:GAME_VER,from:NET.id})});c.on('data',d=>mpOnMsg(d,c));c.on('close',()=>{if(NET.on)mpFail('Se perdió la conexión con el anfitrión')});
   NET.joinTO=setTimeout(()=>{if(!NET.joined)mpFail('No se puede conectar con la sala '+NET.code)},9000)}})}

function mpTo(){return NET.host?'all':(NET.bc?NET.hostIdGuess||'all':'host')}
function mpEnter(){clearTimeout(NET.joinTO);NET.match={mode:'free',on:false,score:{}};initAudio();startGame();zs.length=0;miniQueue.length=0;TRAIN={god:true,freeze:false,km:{},rar:1,slot:0,mp:true};wave=1;waveQueue=0;waveBreak=0;
 P.x=-3+NET.slot*2;P.z=-2;camTX=P.x;scarf.forEach(s=>{s.x=P.x;s.px=P.x});banner('SALA '+NET.code);hudShow(true);sfx('ready')}

function mpLeave(silent){if(!NET.on)return;try{if(NET.host)mpSend('all',{t:'close'});else mpSend(mpTo(),{t:'bye'})}catch(_){}
 mpPickClear();for(const k in NET.peers)mpRemove(k);try{NET.peer&&NET.peer.destroy()}catch(_){}try{NET.bc&&NET.bc.close()}catch(_){}clearTimeout(NET.joinTO);
 Object.assign(NET,{on:false,host:false,peer:null,bc:null,peers:{},conns:{},joined:false,match:null});const hb=document.getElementById('bHunt');if(hb)hb.style.display='none'}

const r2=v=>Math.round(v*100)/100;
function mpCapture(){if(!P||!P.Jdraw)return null;const W=weapon(),g=W.g,q=g.quaternion,p=g.position;

 if(W.g2){const g2=W.g2;st.g2v=g2.visible?1:0;st.g2p=[r2(g2.position.x),r2(g2.position.y),r2(g2.position.z)];st.g2q=[g2.quaternion.x,g2.quaternion.y,g2.quaternion.z,g2.quaternion.w].map(v=>Math.round(v*1000)/1000)}

function mpTick(rdt){if(!NET.on||!NET.joined)return;mpMatchTick(rdt);mpPickTick(rdt);NET.sendT-=rdt;
 if(NET.sendT<=0&&(state==='play'||state==='pause'||state==='dead')){NET.sendT=.05;const st=mpCapture();if(st)mpSend(NET.host?'all':mpTo(),{t:'s',id:NET.id,st})}
 const now=performance.now();for(const k in NET.peers){const p=NET.peers[k];if(NET.host&&p.seen&&now-p.seen>8000)mpDrop(k)}
 mpTags()}

function mpWeaponMesh(p,id,two){p.meshes=p.meshes||{};const key=id+(two?'2':'');let m=p.meshes[key];if(!m){const src=two?WT[id].g2:WT[id].g;if(!src)return null;m=src.clone(true);scene.add(m);p.meshes[key]=m}return m}
const TR_COL={bullet:new THREE.Color(0xffd04a),arrow:new THREE.Color(0xf3e6c8)};
function mpDraw(dt){if(!NET.on)return;mpPickDraw(dt);
 if(NET.tr&&NET.tr.length){for(const t of NET.tr){t.l-=dt;t.x+=t.vx*dt;t.y+=t.vy*dt;t.z+=t.vz*dt;const k=t.k==='bullet'?.05:.035;limb([t.x,t.y,t.z],[t.x-t.vx*k,t.y-t.vy*k,t.z-t.vz*k],t.k==='bullet'?.035:.025,TR_COL[t.k]||COL.rope);if(pointBox(t.x,t.y,t.z))t.l=0}NET.tr=NET.tr.filter(t=>t.l>0)}const a=1-Math.exp(-dt*18);
 for(const k in NET.peers){const p=NET.peers[k],st=p.st;if(p.meshes)for(const q in p.meshes)p.meshes[q].visible=false;if(!st||!p.J)continue;
  for(let i=0;i<p.J.length;i++)for(let c=0;c<3;c++)p.J[i][c]+=(st.J[i][c]-p.J[i][c])*a;
  if(st.dead)continue;
  drawChar(p.J,p.col||(p.col=mpColor(p.slot)),.055,.15);
  if(WT[st.w]){const m=mpWeaponMesh(p,st.w);if(m){m.visible=!!st.gv;m.position.lerp(vTmpA.set(...st.gp),a);m.quaternion.slerp(qTmp.set(...st.gq),a);if(st.ch)chainDraw(p.J[7],[m.position.x,m.position.y,m.position.z],.05)}
   if(st.g2p){const m2=mpWeaponMesh(p,st.w,true);if(m2){m2.visible=!!st.g2v;m2.position.lerp(vTmpA.set(...st.g2p),a);m2.quaternion.slerp(qTmp.set(...st.g2q),a)}}}}}
const vTmpA=new THREE.Vector3(),qTmp=new THREE.Quaternion(),vTag=new THREE.Vector3();
function mpTags(){let box=document.getElementById('mpTags');if(!box){box=document.createElement('div');box.id='mpTags';document.body.appendChild(box)}
 for(const k in NET.peers){const p=NET.peers[k];if(!p.tag){p.tag=document.createElement('div');p.tag.className='mptag';box.appendChild(p.tag)}
  if(!p.J||state==='title'||$('ov').style.display==='flex'||(p.st&&p.st.dead)){p.tag.style.display='none';continue}

/* ---------- MODO CACERÍA (todos contra todos) ----------
   Cada jugador detecta sus propios golpes contra los demás (los demás jugadores se meten como "objetivos" en la lista de enemigos
   solo mientras se procesa tu ataque). El golpeado aplica el daño en su móvil (y puede hacer parry). El anfitrión lleva el marcador. */
var mpCurProj=null;

function mpProxyPush(phase){if(!mpHunt())return;const lag=phase!=='proj'&&weapon().tap;for(const k in NET.peers){const p=NET.peers[k],st=p.st;if(!st||!p.J||st.dead||st.inv)continue;

  pr.x=J[3][0];pr.z=J[3][2];pr.y=Math.min(J[9][1],J[11][1])-.05;if(lag){const o=mpPast(p,100+60);if(o){pr.x=o[1];pr.y=o[2];pr.z=o[3]}}pr.yaw=Math.atan2(J[0][0]-J[3][0]||0,1);pr.alive=true;
  if(pr.iaiT>0){pr.iaiT=0;mpHitProxy(pr,{mode:'waist',vel:[0,2,0]})}
  zs.push(pr)}}
function mpProxyPop(){if(zs.some(z=>z.rp))zs=zs.filter(z=>!z.rp)}
function mpHitProxy(pr,hit,extra){const now=performance.now();NET.hTry=(NET.hTry||0)+1;if(now<pr.hitCd)return;NET.hOut=(NET.hOut||0)+1;pr.hitCd=now+350;
 let dmg=HUNT.dmg*(SM.dmg||1)*(hit&&hit.blunt?1.2:1)*(extra||1);const v=(hit&&hit.vel)||[0,2,0],m=Math.hypot(v[0],v[2])||1,k=Math.min(1,9/m);

 mpSend(NET.host?pr.rp:mpTo(),{t:'hit',tg:pr.rp,by:NET.id,rk:mpCurProj?mpCurProj.k:0,chg:mpCurProj&&(mpCurProj.big||mpCurProj.k==='kunai')?1:0,dmg:Math.round(dmg*(mpCurProj?.8:1)),v:[v[0]*k,Math.min(9,v[1]||2),v[2]*k]})}
function mpTakeHit(m){NET.hIn=(NET.hIn||0)+1;if(!mpHunt()||P.dead||P.inv>0)return;NET.hOk=(NET.hOk||0)+1;
 const a=NET.peers[m.by],ax=a&&a.J?a.J[3][0]:P.x,az=a&&a.J?a.J[3][2]:P.z;
 const front=Math.abs(angDiff(Math.atan2(ax-P.x,az-P.z),P.yaw))<1.5;

 rankMsg='';if(RANK_URL){const q='a=add&id='+encodeURIComponent(PID)+'&name='+encodeURIComponent(rec.name)+'&wave='+rec.wave+'&kills='+rec.kills+'&weapon='+encodeURIComponent(rec.weapon);const top=await rankFetch(q);if(top){rankCache=top;const pos=top.findIndex(r=>r.id===PID);rankMsg=pos>=0?'¡Estás en el puesto '+(pos+1)+' del ranking!':'Partida guardada en el ranking.'}else rankMsg='No se pudo conectar con el ranking (guardado en este dispositivo).';if(state==='dead'&&deadShown){const m=document.getElementById('rankMsg');if(m)m.textContent=rankMsg}return}
 if(!RDB||!RUID){rankMsg='Ranking global no disponible aquí: guardado solo en este dispositivo.';return}
 try{const ref=RDB.doc('scores/'+RUID),cur=await ref.get(),old=cur.exists?cur.data():null;
  if(better(rec,old)||(old&&old.name!==rec.name&&rec.wave===old.wave&&rec.kills===old.kills)){await ref.set(rec);rankMsg='¡Nuevo récord personal subido al ranking!'}else rankMsg='Tu mejor marca sigue siendo oleada '+old.wave+'.'}
 catch(e){rankMsg=e&&e.code==='invalid_argument'?'No tienes permiso para subir al ranking global (solo en este dispositivo).':'No se pudo conectar con el ranking.'}
 if(state==='dead'&&deadShown){const m=document.getElementById('rankMsg');if(m)m.textContent=rankMsg}}
async function renameInRank(){if(!RDB||!RUID)return;try{const ref=RDB.doc('scores/'+RUID),cur=await ref.get();if(cur.exists){const d=Object.assign({},cur.data());const n=cleanName(playerName)||'Anónimo';if(d.name!==n){d.name=n;await ref.set(d)}}}catch(e){}}
function showName(force){const o=$('ov');o.style.display='flex';
 o.innerHTML=`<h1 style="font-size:40px">${force?'STICK RŌNIN':'TU NOMBRE'}</h1><h2>${force?'Escribe tu nombre para jugar':'Así aparecerás en el ranking'}</h2><input id="nmIn" maxlength="16" autocomplete="off" style="font:800 22px system-ui;padding:12px 14px;border-radius:12px;border:2px solid #4a434f;background:#1b181e;color:#fff;text-align:center;width:min(320px,80vw)" placeholder="Rōnin sin nombre">
 <div><button class="edl" id="bNmOk" type="button" style="background:#d1242c;border-color:#d1242c">${force?'▶ Entrar':'✔ Guardar'}</button>${force?'':' <button class="edl" id="bBack" type="button">← Volver</button>'}</div><p id="nmErr" style="color:#ff6a6a;min-height:18px"></p>`;
 const i=$('nmIn');i.value=playerName;setTimeout(()=>{try{i.focus()}catch(e){}},50);i.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')saveName()})}
function saveName(){const i=$('nmIn'),n=cleanName(i?i.value:playerName);if(!n){const e=$('nmErr');if(e)e.textContent='Escribe un nombre';return}playerName=n;try{localStorage.setItem(NAME_KEY,playerName)}catch(e){}renameInRank();showTitle()}
async function loadRank(){let rows=null;
 if(RANK_URL){rows=await rankFetch('a=top');if(rows){rankCache=rows;rows=rows.map(r=>Object.assign({},r))}else if(rankCache)rows=rankCache}
 if(!rows&&RDB){const tm=new Promise(r=>setTimeout(()=>r(null),10000));try{const snap=await Promise.race([RDB.collection('scores').orderBy('wave','desc').limit(100).get(),tm]);if(snap)rows=snap.docs.map(d=>Object.assign({id:d.id},d.data()))}catch(e){}}
 if(!rows)rows=localRank();return rows.filter(r=>r&&typeof r.wave==='number').sort((a,b)=>b.wave-a.wave||(b.kills||0)-(a.kills||0)).slice(0,10)}
async function fillRank(list){if(!list)return;const rows=await loadRank();if(!document.contains(list))return;
 if(!rows.length){list.style.textAlign='center';list.textContent='Todavía no hay nadie. ¡Sé el primero!';return}
 list.innerHTML=rows.map((r,i)=>`<div style="display:flex;gap:8px;align-items:center;padding:5px 9px;margin:3px 0;border-radius:9px;background:${(r.id&&(r.id===PID||r.id===RUID))||(!r.id&&r.name===playerName)?'rgba(209,36,44,.35)':'rgba(44,40,50,.8)'}"><b style="width:22px;color:${i<3?['#ffd04a','#d8d8e0','#d08a4a'][i]:'#999'}">${i+1}</b><span style="flex:1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name||'Anónimo')}</span><span style="opacity:.6;font-size:11px">${esc(r.weapon||'')}</span><span style="min-width:74px;text-align:right">Oleada <b>${+r.wave|0}</b></span></div>`).join('')}
setInterval(()=>{if(state==='title'&&document.hidden!==true){const l=document.getElementById('rkList');if(l&&document.getElementById('bName')&&!document.querySelector('#keys[style*="block"]'))fillRank(l)}},30000);
async function showRanking(){const o=$('ov');o.style.display='flex';
 o.innerHTML=`<h1 style="font-size:40px">🏆 TOP 10</h1><div id="rkList" style="width:min(420px,92vw);text-align:left;font:15px system-ui">Cargando…</div><button class="edl" id="bBack" type="button">← Volver</button>`;fillRank($('rkList'))}
function showDead(){const o=$('ov');o.style.display='flex';o.innerHTML=`<h1 style="color:#e0404a">HAS MUERTO</h1><h2 style="color:#fff">Oleada ${wave} · ${kills} bajas · récord ${best}</h2><p id="rankMsg" style="opacity:.8">${esc(rankMsg)}</p><div class="go">Toca para reintentar</div><button class="edl" id="bRankD" type="button">🏆 Ranking</button> <button class="edl" id="bMenuD" type="button">☰ Menú principal</button>`}
$('forge').addEventListener('click',forgeAct);$('dojo').addEventListener('click',dojoAct);$('bDojo').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();openDojo()});
$('ov').addEventListener('pointerdown',e=>{if(e.target.closest('a'))return;{const mb=e.target.closest('[data-mp]');if(mb){e.preventDefault();mpAct(mb.dataset.mp);return}if(e.target.id==='mpIn')return;}if(e.target.id==='bKeys'||e.target.id==='bKeys2'){e.preventDefault();openKeys();return}if(e.target.id==='bRank'||e.target.id==='bRankD'){e.preventDefault();showRanking();return}if(e.target.id==='bName'){e.preventDefault();showName();return}if(e.target.id==='bInfo'){e.preventDefault();showInfo();return}if(e.target.id==='bNmOk'){e.preventDefault();saveName();return}if(e.target.id==='bBack'){e.preventDefault();if(state==='dead'){showDead()}else showTitle();return}if(e.target.id==='nmIn'||document.getElementById('nmIn')||(document.getElementById('rkList')&&state!=='title')||document.getElementById('bInfo')&&e.target.closest('#rkList'))return;if(state==='title'&&!$('bName')&&!e.target.closest('.go,#bCont,#bHorde,#bYokai,#bTrain'))return;if(e.target.id==='bResume'){e.preventDefault();resumeGame();return}if(e.target.id==='bToMenu'){e.preventDefault();goMenu();return}if(e.target.id==='bMenuD'){e.preventDefault();goMenu();return}if(state==='pause')return;if(e.target.id==='bHorde'){e.preventDefault();initAudio();startGame(true);return}if(e.target.id==='bCont'){e.preventDefault();initAudio();continueRun();return}if(e.target.id==='bTrain'){e.preventDefault();initAudio();startDojo();return}if(e.target.id==='bYokai'){e.preventDefault();initAudio();startGame();YK_KINDS.forEach((k,i)=>setTimeout(()=>{if(state==='play')spawnYokai(k,i*1.256)},800+i*900));return}e.preventDefault();initAudio();if(state==='title'||(state==='dead'&&deadT>1.2))startGame()});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
resetGame();resize();showTitle();hudShow(false);
{const ms=slashMats(),wm=new THREE.Mesh(new THREE.PlaneGeometry(.01,.01),ms[0]),wm2=new THREE.Mesh(new THREE.PlaneGeometry(.01,.01),ms[1]);wm.position.set(0,-5,0);wm2.position.set(0,-5,0);scene.add(wm,wm2);try{renderer.compile(scene,camera)}catch(e){}scene.remove(wm,wm2);slashMatPool.push(ms)}
let last=performance.now(),acc=0,deadShown=false,perfAcc=0,perfN=0,quality=2,qGood=0,qDownT=-1e9;
// móviles modestos empiezan en calidad media; si el móvil se queda sin memoria gráfica, se guarda y se ofrece recargar
{const lowEnd=IS_MOBILE||(navigator.deviceMemory&&navigator.deviceMemory<=4)||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4);if(lowEnd)setTimeout(()=>{if(quality>1){quality=1;applyQuality()}},0)}
renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();try{if(state==='play'||state==='forge')saveRun()}catch(_){}const o=$('ov');o.style.display='flex';
 o.innerHTML='<h2>El móvil se ha quedado sin memoria gráfica</h2><p style="opacity:.8">Tu partida está guardada en la última oleada.</p><button class="edl" type="button" onclick="location.reload()" style="font-size:18px;padding:12px 20px;background:#d1242c;border-color:#d1242c">↻ Recargar y continuar</button>'},false);
function applyQuality(){
 const dpr=window.devicePixelRatio||1;
 if(quality===1){renderer.setPixelRatio(Math.min(dpr,1));sun.shadow.mapSize.set(512,512);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}
 if(quality===0){renderer.setPixelRatio(Math.min(dpr,.75));sun.castShadow=false}
 if(quality===2){renderer.setPixelRatio(Math.min(dpr,1.25));sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}
 if(quality===1)sun.castShadow=true;
 resize();
}
// un error en un fotograma ya no congela el juego: se registra y se sigue
const ERRS={n:0,last:[]};window.__errs=ERRS;
// cada error distinto se manda a Sentry una vez por partida, con el contexto del momento
const SENT=new Set();
function sentryReport(e,where){try{const k=where+':'+(e&&e.message);if(SENT.has(k)||SENT.size>20||!window.Sentry||!Sentry.captureException)return;SENT.add(k);
 Sentry.withScope(sc=>{sc.setTag('donde',where);sc.setTag('version',GAME_VER);sc.setTag('modo',SIEGE.on?'asedio':NET.on?'multijugador':TRAIN?'dojo':'normal');sc.setTag('calidad',String(quality));sc.setTag('movil',String(IS_MOBILE));
  sc.setContext('partida',{oleada:wave,estado:state,arma:weapon().id,enemigos:zs.length,ragdolls:rags.length,particulas:parts.length});Sentry.captureException(e)})}catch(_){}}
function safeRun(f,where){try{f()}catch(e){sentryReport(e,where);ERRS.n++;if(ERRS.last.length<8)ERRS.last.push(where+': '+(e&&e.message)+' @'+((e&&e.stack||'').split('\n')[1]||'').trim());if(ERRS.n<=3)console.error('[StickRonin]',where,e)}}
// hit-stop en ráfagas: mira cuánta congelación nueva han pedido los golpes desde el fotograma anterior y la acorta si es una ráfaga de golpes normales
let hsLeft=0,hsLastT=-9,hsWinT=-9,hsSpent=0;
function hitstopBurst(t){
 if(!(hitstop>hsLeft+1e-4)){if(hitstop<hsLeft)hsLeft=Math.max(0,hitstop);return}
 const add=hitstop-hsLeft;
 if(!JUICE.hsBurst||hitstop>=JUICE.HS_BIG){hsLastT=t;return} // golpe firma: se mira lo pedido (hitstop=max(...)), no solo lo añadido
 if(t-hsWinT>1){hsWinT=t;hsSpent=0}
 let k=t-hsLastT<JUICE.HS_WINDOW?JUICE.HS_REPEAT_K:1;hsLastT=t;
 const eff=Math.min(add*k,Math.max(0,JUICE.HS_MAX_PER_SEC-hsSpent));hsSpent+=eff;hitstop=hsLeft+eff;
}
function frame(now){
 requestAnimationFrame(frame);
 safeRun(pollPad,'pad');
 const rdt=Math.min(.05,(now-last)/1000);last=now;let dt=rdt;
 hitstopBurst(now/1000);
 if(hitstop>0){hitstop-=rdt;dt=0}
 hsLeft=Math.max(0,hitstop);
 let ts=1;if(slowT>0){slowT-=rdt;ts=.3}
 if(state==='forge'||state==='dojo'||state==='pause')acc=0;
 acc+=dt*ts;let n=0;while(acc>=DT&&n<3){safeRun(step,'step');acc-=DT;n++}if(n>=3)acc=0;
 perfAcc+=rdt;perfN++;if(perfN>=45){const avg=perfAcc/perfN;
   // baja de calidad si va a menos de ~42 fps; si va sobrado unos 4 s seguidos (y hace 20 s que no bajó), vuelve a subir
   if(avg>.024&&quality>0){quality--;applyQuality();qDownT=performance.now();qGood=0}
   else if(avg<.0185&&quality<2&&state==='play'){qGood++;if(qGood>=5&&performance.now()-qDownT>20000){quality++;applyQuality();qGood=0}}else qGood=0;
   perfAcc=perfN=0}
 if(state==='dead'&&deadT>1&&!deadShown){deadShown=true;showDead();hudShow(false)}
 if(state==='play')deadShown=false;
 NET.dt=rdt;safeRun(placeCamera,'cam');safeRun(draw,'draw');safeRun(hud,'hud');if(NET.on)safeRun(()=>mpTick(rdt),'net');
 pMat.uniforms.uScale.value=innerHeight*renderer.getPixelRatio()/(2*Math.tan(camera.fov*D2R/2));
 renderer.render(scene,camera);
}
requestAnimationFrame(frame);
}
